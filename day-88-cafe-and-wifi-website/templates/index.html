<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafe & Wi-Fi Directory</title>
    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --coffee-dark: #2c1e16;
        --coffee-accent: #c07a3e;
        --cream-bg: #faf7f2;
      }
      body {
        background-color: var(--cream-bg);
        color: #2b2b2b;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
      }
      .navbar {
        background-color: var(--coffee-dark);
      }
      .hero-section {
        background:
          linear-gradient(rgba(44, 30, 22, 0.85), rgba(44, 30, 22, 0.85)),
          url('https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=1600&q=80')
            center/cover;
        color: white;
        padding: 3.5rem 0;
      }
      .cafe-card {
        border: none;
        border-radius: 12px;
        overflow: hidden;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        background: #fff;
      }
      .cafe-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
      }
      .cafe-img {
        height: 200px;
        object-fit: cover;
      }
      .amenity-badge {
        font-size: 0.8rem;
        padding: 0.35em 0.65em;
        border-radius: 6px;
      }
      .btn-coffee {
        background-color: var(--coffee-accent);
        color: white;
        border: none;
      }
      .btn-coffee:hover {
        background-color: #a8662e;
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark sticky-top shadow-sm">
      <div class="container">
        <a
          class="navbar-brand fw-bold d-flex align-items-center gap-2"
          href="#"
        >
          <i class="bi bi-cup-hot-fill text-warning"></i> Cafe & Wi-Fi
        </a>
        <div class="d-flex gap-2">
          <button
            class="btn btn-outline-light btn-sm"
            onclick="fetchRandomCafe()"
          >
            <i class="bi bi-shuffle"></i> Random Pick
          </button>
          <button
            class="btn btn-coffee btn-sm fw-semibold"
            data-bs-toggle="modal"
            data-bs-target="#addCafeModal"
          >
            <i class="bi bi-plus-lg"></i> Add Cafe
          </button>
        </div>
      </div>
    </nav>

    <!-- Hero & Search -->
    <header class="hero-section text-center">
      <div class="container">
        <h1 class="display-5 fw-bold mb-2">Remote Work & Great Coffee</h1>
        <p class="lead text-light opacity-75 mb-4">
          Find laptop-friendly cafes with fast Wi-Fi, power sockets, and quality
          brews.
        </p>

        <div class="row justify-content-center">
          <div class="col-md-7 col-lg-6">
            <form id="searchForm" class="input-group input-group-lg shadow">
              <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search by neighborhood (e.g., Peckham, London Bridge)..."
              />
              <button class="btn btn-coffee px-4" type="submit">
                <i class="bi bi-search"></i> Search
              </button>
              <button
                class="btn btn-light"
                type="button"
                onclick="resetSearch()"
                title="Show All"
              >
                <i class="bi bi-arrow-counterclockwise"></i>
              </button>
            </form>
          </div>
        </div>

        <!-- Client-side Quick Filters -->
        <div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
          <div class="form-check form-check-inline text-white">
            <input
              class="form-check-input filter-check"
              type="checkbox"
              id="filterWifi"
              onchange="applyFilters()"
            />
            <label class="form-check-label" for="filterWifi"
              ><i class="bi bi-wifi"></i> Wi-Fi</label
            >
          </div>
          <div class="form-check form-check-inline text-white">
            <input
              class="form-check-input filter-check"
              type="checkbox"
              id="filterSockets"
              onchange="applyFilters()"
            />
            <label class="form-check-label" for="filterSockets"
              ><i class="bi bi-plug"></i> Sockets</label
            >
          </div>
          <div class="form-check form-check-inline text-white">
            <input
              class="form-check-input filter-check"
              type="checkbox"
              id="filterToilet"
              onchange="applyFilters()"
            />
            <label class="form-check-label" for="filterToilet"
              ><i class="bi bi-door-open"></i> Toilet</label
            >
          </div>
          <div class="form-check form-check-inline text-white">
            <input
              class="form-check-input filter-check"
              type="checkbox"
              id="filterCalls"
              onchange="applyFilters()"
            />
            <label class="form-check-label" for="filterCalls"
              ><i class="bi bi-telephone"></i> Calls OK</label
            >
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container my-5">
      <!-- Toast Notification Container -->
      <div
        id="alertBox"
        class="alert d-none alert-dismissible fade show"
        role="alert"
      >
        <span id="alertMessage"></span>
        <button type="button" class="btn-close" onclick="hideAlert()"></button>
      </div>

      <!-- Random Spotlight Banner -->
      <div id="randomBanner" class="card border-warning mb-4 d-none shadow-sm">
        <div
          class="card-body d-flex flex-wrap align-items-center justify-content-between gap-3 bg-warning bg-opacity-10"
        >
          <div>
            <span class="badge bg-warning text-dark mb-1"
              >Random Recommendation</span
            >
            <h5 class="mb-0 fw-bold" id="randomTitle"></h5>
            <small class="text-muted" id="randomDetails"></small>
          </div>
          <div class="d-flex gap-2">
            <a
              id="randomMapLink"
              href="#"
              target="_blank"
              class="btn btn-sm btn-dark"
              >Open Map</a
            >
            <button
              class="btn btn-sm btn-outline-secondary"
              onclick="
                document.getElementById('randomBanner').classList.add('d-none')
              "
            >
              Dismiss
            </button>
          </div>
        </div>
      </div>

      <!-- Cafe Grid -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">
          Available Cafes
          <span class="badge bg-secondary rounded-pill fs-6" id="cafeCount"
            >0</span
          >
        </h4>
      </div>

      <div id="cafeGrid" class="row g-4">
        <!-- Cafe cards injected here via JS -->
      </div>
    </main>

    <!-- ADD CAFE MODAL -->
    <div class="modal fade" id="addCafeModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <form id="addCafeForm">
            <div class="modal-header">
              <h5 class="modal-title fw-bold">Add a New Cafe</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Cafe Name *</label>
                  <input
                    type="text"
                    name="name"
                    class="form-control"
                    required
                    placeholder="e.g., Grind Coffee Bar"
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Location / Neighborhood *</label>
                  <input
                    type="text"
                    name="loc"
                    class="form-control"
                    required
                    placeholder="e.g., Shoreditch"
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Google Maps URL *</label>
                  <input
                    type="url"
                    name="map_url"
                    class="form-control"
                    required
                    placeholder="https://goo.gl/maps/..."
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Photo URL *</label>
                  <input
                    type="url"
                    name="img_url"
                    class="form-control"
                    required
                    placeholder="https://images.unsplash.com/..."
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Seating Capacity *</label>
                  <select name="seats" class="form-select" required>
                    <option value="0-10">0-10 seats</option>
                    <option value="10-20">10-20 seats</option>
                    <option value="20-30" selected>20-30 seats</option>
                    <option value="30-40">30-40 seats</option>
                    <option value="50+">50+ seats</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Coffee Price</label>
                  <input
                    type="text"
                    name="coffee_price"
                    class="form-control"
                    placeholder="e.g., £2.80"
                  />
                </div>
                <div class="col-12">
                  <label class="form-label d-block">Amenities</label>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="wifi"
                      id="addWifi"
                      checked
                    />
                    <label class="form-check-label" for="addWifi"
                      >Has Wi-Fi</label
                    >
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="sockets"
                      id="addSockets"
                      checked
                    />
                    <label class="form-check-label" for="addSockets"
                      >Power Sockets</label
                    >
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="toilet"
                      id="addToilet"
                      checked
                    />
                    <label class="form-check-label" for="addToilet"
                      >Restroom</label
                    >
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="calls"
                      id="addCalls"
                    />
                    <label class="form-check-label" for="addCalls"
                      >Can Take Calls</label
                    >
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-coffee">Save Cafe</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- DELETE CAFE MODAL -->
    <div
      class="modal fade"
      id="deleteCafeModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="deleteCafeForm">
            <div class="modal-header">
              <h5 class="modal-title fw-bold text-danger">
                Report Cafe Closed
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <p>
                Are you sure you want to remove
                <strong id="deleteCafeName"></strong>?
              </p>
              <input type="hidden" id="deleteCafeId" />
              <div class="mb-3">
                <label class="form-label">Admin API Key *</label>
                <input
                  type="password"
                  id="apiKeyInput"
                  class="form-control"
                  required
                  placeholder="Enter API Key (TopSecretAPIKey)"
                />
                <div class="form-text">
                  Hint: Default key in your backend is
                  <code>TopSecretAPIKey</code>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-danger">Delete Cafe</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      let currentCafes = [];

      // Load all cafes on initial page load
      document.addEventListener('DOMContentLoaded', () => {
        loadAllCafes();
      });

      function showAlert(message, type = 'success') {
        const alertBox = document.getElementById('alertBox');
        alertBox.className = `alert alert-${type} alert-dismissible fade show`;
        document.getElementById('alertMessage').textContent = message;
      }

      function hideAlert() {
        document.getElementById('alertBox').classList.add('d-none');
      }

      // Fetch /all
      async function loadAllCafes() {
        try {
          const res = await fetch('/all');
          const data = await res.json();
          currentCafes = data.cafes || [];
          applyFilters();
        } catch (err) {
          showAlert('Failed to load cafes from API.', 'danger');
        }
      }

      // Search via /search?loc=...
      document
        .getElementById('searchForm')
        .addEventListener('submit', async (e) => {
          e.preventDefault();
          const loc = document.getElementById('searchInput').value.trim();
          if (!loc) {
            loadAllCafes();
            return;
          }
          try {
            const res = await fetch(`/search?loc=${encodeURIComponent(loc)}`);
            const data = await res.json();
            if (res.ok) {
              currentCafes = data.cafes;
              hideAlert();
            } else {
              currentCafes = [];
              showAlert(data.error['Not Found'], 'warning');
            }
            applyFilters();
          } catch (err) {
            showAlert('Error searching cafes.', 'danger');
          }
        });

      function resetSearch() {
        document.getElementById('searchInput').value = '';
        document
          .querySelectorAll('.filter-check')
          .forEach((cb) => (cb.checked = false));
        hideAlert();
        loadAllCafes();
      }

      // Filter displayed cafes by amenity checkboxes
      function applyFilters() {
        const reqWifi = document.getElementById('filterWifi').checked;
        const reqSockets = document.getElementById('filterSockets').checked;
        const reqToilet = document.getElementById('filterToilet').checked;
        const reqCalls = document.getElementById('filterCalls').checked;

        const filtered = currentCafes.filter((c) => {
          if (reqWifi && !c.has_wifi) return false;
          if (reqSockets && !c.has_sockets) return false;
          if (reqToilet && !c.has_toilet) return false;
          if (reqCalls && !c.can_take_calls) return false;
          return true;
        });

        renderCafes(filtered);
      }

      // Render Cafe Cards
      function renderCafes(cafes) {
        const grid = document.getElementById('cafeGrid');
        document.getElementById('cafeCount').textContent = cafes.length;

        if (cafes.length === 0) {
          grid.innerHTML = `<div class="col-12 text-center py-5 text-muted"><h5>No cafes match your current criteria.</h5></div>`;
          return;
        }

        grid.innerHTML = cafes
          .map(
            (cafe) => `
            <div class="col-md-6 col-lg-4">
                <div class="card cafe-card h-100 shadow-sm">
                    <img src="${cafe.img_url}" class="card-img-top cafe-img" alt="${cafe.name}" 
                         onerror="this.src='https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=800&q=80'">
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start mb-1">
                            <h5 class="card-title fw-bold mb-0">${cafe.name}</h5>
                            <span class="badge bg-dark fs-6">${cafe.coffee_price || 'N/A'}</span>
                        </div>
                        <p class="text-muted small mb-3">
                            <i class="bi bi-geo-alt-fill text-danger"></i> ${cafe.location} &bull; 
                            <i class="bi bi-people-fill"></i> ${cafe.seats}
                        </p>

                        <!-- Amenities -->
                        <div class="d-flex flex-wrap gap-1 mb-3">
                            <span class="amenity-badge ${cafe.has_wifi ? 'bg-success-subtle text-success' : 'bg-light text-muted text-decoration-line-through'}">
                                <i class="bi bi-wifi"></i> Wi-Fi
                            </span>
                            <span class="amenity-badge ${cafe.has_sockets ? 'bg-success-subtle text-success' : 'bg-light text-muted text-decoration-line-through'}">
                                <i class="bi bi-plug"></i> Sockets
                            </span>
                            <span class="amenity-badge ${cafe.has_toilet ? 'bg-success-subtle text-success' : 'bg-light text-muted text-decoration-line-through'}">
                                <i class="bi bi-door-open"></i> Toilet
                            </span>
                            <span class="amenity-badge ${cafe.can_take_calls ? 'bg-success-subtle text-success' : 'bg-light text-muted text-decoration-line-through'}">
                                <i class="bi bi-telephone"></i> Calls
                            </span>
                        </div>

                        <!-- Actions -->
                        <div class="mt-auto pt-2 border-top d-flex justify-content-between align-items-center">
                            <a href="${cafe.map_url}" target="_blank" class="btn btn-sm btn-outline-dark">
                                <i class="bi bi-map"></i> Map
                            </a>
                            <div class="btn-group">
                                <button class="btn btn-sm btn-outline-secondary" onclick="promptUpdatePrice(${cafe.id}, '${cafe.coffee_price || ''}')" title="Update Coffee Price">
                                    <i class="bi bi-pencil"></i> Price
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="openDeleteModal(${cafe.id}, '${cafe.name.replace(/'/g, "\\'")}')" title="Report Closed">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `,
          )
          .join('');
      }

      // Fetch /random
      async function fetchRandomCafe() {
        try {
          const res = await fetch('/random');
          const data = await res.json();
          if (res.ok && data.cafe) {
            const c = data.cafe;
            document.getElementById('randomTitle').textContent =
              `${c.name} (${c.location})`;
            document.getElementById('randomDetails').textContent =
              `Coffee: ${c.coffee_price || 'N/A'} | Seats: ${c.seats} | Wi-Fi: ${c.has_wifi ? 'Yes' : 'No'} | Sockets: ${c.has_sockets ? 'Yes' : 'No'}`;
            document.getElementById('randomMapLink').href = c.map_url;
            document.getElementById('randomBanner').classList.remove('d-none');
          }
        } catch (err) {
          showAlert('Could not fetch random cafe.', 'danger');
        }
      }

      // Add New Cafe via POST /add
      document
        .getElementById('addCafeForm')
        .addEventListener('submit', async (e) => {
          e.preventDefault();
          const form = e.target;
          const payload = {
            name: form.name.value,
            loc: form.loc.value,
            map_url: form.map_url.value,
            img_url: form.img_url.value,
            seats: form.seats.value,
            coffee_price: form.coffee_price.value,
            wifi: form.wifi.checked,
            sockets: form.sockets.checked,
            toilet: form.toilet.checked,
            calls: form.calls.checked,
          };

          try {
            const res = await fetch('/add', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(payload),
            });
            const data = await res.json();
            if (res.ok) {
              bootstrap.Modal.getInstance(
                document.getElementById('addCafeModal'),
              ).hide();
              form.reset();
              showAlert(data.response.success, 'success');
              loadAllCafes();
            } else {
              showAlert(
                data.error['Bad Request'] || 'Error adding cafe.',
                'danger',
              );
            }
          } catch (err) {
            showAlert('Network error while adding cafe.', 'danger');
          }
        });

      // Update Price via PATCH /update-price/<id>?new_price=...
      async function promptUpdatePrice(cafeId, currentPrice) {
        const newPrice = prompt(
          'Enter the new coffee price (e.g., £2.90):',
          currentPrice,
        );
        if (newPrice === null || newPrice.trim() === '') return;

        try {
          const res = await fetch(
            `/update-price/${cafeId}?new_price=${encodeURIComponent(newPrice.trim())}`,
            {
              method: 'PATCH',
            },
          );
          const data = await res.json();
          if (res.ok) {
            showAlert(data.response.success, 'success');
            loadAllCafes();
          } else {
            showAlert(data.error['Not Found'], 'danger');
          }
        } catch (err) {
          showAlert('Failed to update price.', 'danger');
        }
      }

      // Open Delete Modal
      function openDeleteModal(id, name) {
        document.getElementById('deleteCafeId').value = id;
        document.getElementById('deleteCafeName').textContent = name;
        document.getElementById('apiKeyInput').value = '';
        new bootstrap.Modal(document.getElementById('deleteCafeModal')).show();
      }

      // Delete Cafe via DELETE /report-closed/<id>?api-key=...
      document
        .getElementById('deleteCafeForm')
        .addEventListener('submit', async (e) => {
          e.preventDefault();
          const id = document.getElementById('deleteCafeId').value;
          const apiKey = document.getElementById('apiKeyInput').value.trim();

          try {
            const res = await fetch(
              `/report-closed/${id}?api-key=${encodeURIComponent(apiKey)}`,
              {
                method: 'DELETE',
              },
            );
            const data = await res.json();
            bootstrap.Modal.getInstance(
              document.getElementById('deleteCafeModal'),
            ).hide();

            if (res.ok) {
              showAlert(data.response.success, 'success');
              loadAllCafes();
            } else {
              const errMsg =
                data.error['Forbidden'] ||
                data.error['Not Found'] ||
                'Delete failed.';
              showAlert(errMsg, 'danger');
            }
          } catch (err) {
            showAlert('Network error while deleting cafe.', 'danger');
          }
        });
    </script>
  </body>
</html>
